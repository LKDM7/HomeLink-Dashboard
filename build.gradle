tasks.named('check') { dependsOn tasks.named('verificationClasses') }

// Explicit locale for reproducible UI checks; normal runClient preferences are untouched.
def smokeLanguage = providers.gradleProperty('smokeLanguage').orElse('').get()
if (!smokeLanguage.isEmpty()) {
    ['runPreferencesSmoke': 'preferences', 'runActionSmoke': 'actions',
     'runAlertsSmoke': 'alerts', 'runConnectionSmoke': 'connection'].each { runName, directory ->
        def localeOptions = layout.buildDirectory.file("validation/${directory}/options.txt")
        tasks.named(runName) {
            doFirst {
                def file = localeOptions.get().asFile
                file.parentFile.mkdirs()
                def content = file.exists() ? file.getText('UTF-8') : 'onboardAccessibility:false\npauseOnLostFocus:false\nrenderDistance:2\nsimulationDistance:5\nmaxFps:60\n'
                content = content.replaceAll('(?m)^lang:[^\\r\\n]*[\\r\\n]*', '')
                file.setText(content.stripTrailing() + '\nlang:' + smokeLanguage + '\n', 'UTF-8')
            }
        }
    }
}

// Several game clients compete for the same GPU. Keep verification runs sequential
// even when Gradle's parallel execution is enabled for compilation.
abstract class MinecraftRunLock implements org.gradle.api.services.BuildService<org.gradle.api.services.BuildServiceParameters.None> { }
def minecraftRunLock = gradle.sharedServices.registerIfAbsent('homelinkMinecraftRuns', MinecraftRunLock) {
    maxParallelUsages = 1
}
tasks.matching { it.name in ['runClient', 'runServer', 'runGameTestServer', 'runClientSmoke', 'runConnectionSmoke',
                            'runActionSmoke', 'runPreferencesSmoke', 'runAlertsSmoke', 'runPerformanceSmoke', 'runPersistence'] }
        .configureEach { usesService(minecraftRunLock) }

def smokeLog = layout.buildDirectory.file('validation/client/logs/latest.log')
def smokeOptions = layout.buildDirectory.file('validation/client/options.txt')
tasks.named('runClientSmoke') {
    doFirst {
        def options = smokeOptions.get().asFile
        if (!options.exists()) {
            options.parentFile.mkdirs()
            options.setText('onboardAccessibility:false\npauseOnLostFocus:false\nrenderDistance:2\nsimulationDistance:5\nmaxFps:60\n', 'UTF-8')
        }
    }
    doLast {
        def report = smokeLog.get().asFile
        def result = report.exists() ? report.getText('UTF-8') : ''
        if (!result.contains('HOMELINK_CLIENT_SMOKE_OK') || result.contains('HOMELINK_CLIENT_SMOKE_FAILED')) {
            throw new GradleException('Connected-client verification failed; inspect build/validation/client/logs/latest.log.')
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }


dependencies {
    implementation 'fr.lkdm.homecore:homecore:1.9.0'
    // Required at runtime: every Dashboard block runs on HE supplied by HomeLink Energy (published to Maven local).
    runtimeOnly 'fr.lkdm.homelink.energy:homelink_energy:0.2.1'
    // Example mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-forge-api:${jei_version}"
    // runtimeOnly "mezz.jei:jei-${mc_version}-forge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(Jar).configureEach {
    includeEmptyDirs = false
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.named('jar', Jar) { from('LICENSE') }

def releaseJar = tasks.named('jar', Jar).flatMap { it.archiveFile }
def releaseVersion = providers.gradleProperty('mod_version').get()
def verifyReleaseJar = tasks.register('verifyReleaseJar') {
    dependsOn tasks.named('jar')
    inputs.file(releaseJar)
    doLast {
        new java.util.zip.ZipFile(releaseJar.get().asFile).withCloseable { archive ->
            def names = archive.entries().collect { it.name }
            def forbidden = names.find { it.startsWith('fr/lkdm/homecore/') || it.startsWith('CoreLink/') ||
                    it.contains('/verification/') || it.endsWith('.log') || it.endsWith('.java') }
            if (forbidden != null) throw new GradleException('Unexpected development/dependency content: ' + forbidden)
            def expected = ['META-INF/neoforge.mods.toml', 'LICENSE',
                            'fr/lkdm/homelink/dashboard/HomeLinkDashboard.class',
                            'assets/homelink_dashboard/lang/en_us.json', 'assets/homelink_dashboard/lang/fr_fr.json']
            ['home_server', 'dashboard_display', 'signal_repeater'].each { block ->
                expected += ['assets/homelink_dashboard/blockstates/' + block + '.json',
                             'assets/homelink_dashboard/models/item/' + block + '.json',
                             'data/homelink_dashboard/recipe/' + block + '.json',
                             'data/homelink_dashboard/loot_table/blocks/' + block + '.json']
            }
            expected.each { name -> if (!names.contains(name)) throw new GradleException('Missing release resource: ' + name) }
            def read = { String name -> archive.getInputStream(archive.getEntry(name)).withCloseable { it.getText('UTF-8') } }
            def metadata = read('META-INF/neoforge.mods.toml')
            if (!metadata.contains('version = "' + releaseVersion + '"') || metadata.contains('${') ||
                    !metadata.contains('versionRange = "[1.9.0,2.0.0)"') || !metadata.contains('modId = "homelink_energy"') || !metadata.contains('versionRange = "[1.21.1]"'))
                throw new GradleException('Release metadata/version/dependency mismatch')
            def parser = new groovy.json.JsonSlurper()
            def english = parser.parseText(read('assets/homelink_dashboard/lang/en_us.json'))
            def french = parser.parseText(read('assets/homelink_dashboard/lang/fr_fr.json'))
            if (english.keySet() != french.keySet()) throw new GradleException('EN/FR translation keys differ')
            english.each { key, value ->
                if (!value || !french[key] || (value =~ /%s/).count != (french[key] =~ /%s/).count)
                    throw new GradleException('Invalid translation or placeholder mismatch: ' + key)
            }
            names.findAll { it.endsWith('.json') }.each { parser.parseText(read(it)) }
            logger.lifecycle('Release archive verified: {} ({} translations)', releaseJar.get().asFile.name, english.size())
        }
    }
}
tasks.named('check') { dependsOn verifyReleaseJar }

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
