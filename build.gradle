plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.147'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    mavenCentral()
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets {
    verification {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    verificationImplementation.extendsFrom implementation
    verificationRuntimeOnly.extendsFrom runtimeOnly
}

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version
    addModdingDependenciesTo sourceSets.verification

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers.add('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            gameDirectory = file('build/validation/server')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'homelink_dashboard_validation'
        }

        clientSmoke {
            client()
            gameDirectory = file('build/validation/client')
            systemProperty 'homelink.clientSmoke', 'true'
        }
        connectionSmoke {
            client()
            gameDirectory = file('build/validation/connection')
            systemProperty 'homelink.connectionSmoke', 'true'
        }
        actionSmoke {
            client()
            gameDirectory = file('build/validation/actions')
            systemProperty 'homelink.actionSmoke', 'true'
        }
        preferencesSmoke {
            client()
            gameDirectory = file('build/validation/preferences')
            systemProperty 'homelink.preferencesSmoke', 'true'
        }
        alertsSmoke {
            client()
            gameDirectory = file('build/validation/alerts')
            systemProperty 'homelink.alertsSmoke', 'true'
        }
        performanceSmoke {
            client()
            gameDirectory = file('build/validation/performance')
            systemProperty 'homelink.performanceSmoke', 'true'
        }
        persistence {
            type = 'gameTestServer'
            gameDirectory = file('build/validation/persistence')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'homelink_dashboard_validation'
            systemProperty 'homelink.persistencePass', providers.gradleProperty('persistencePass').getOrElse('read')
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        homelink_dashboard_validation {
            sourceSet(sourceSets.verification)
        }
    }
    runs.configureEach { loadedMods = [mods.homelink_dashboard] }
    runs.gameTestServer.loadedMods = [mods.homelink_dashboard, mods.homelink_dashboard_validation]
    runs.clientSmoke.loadedMods = [mods.homelink_dashboard, mods.homelink_dashboard_validation]
    runs.connectionSmoke.loadedMods = [mods.homelink_dashboard, mods.homelink_dashboard_validation]
    runs.actionSmoke.loadedMods = [mods.homelink_dashboard, mods.homelink_dashboard_validation]
    runs.preferencesSmoke.loadedMods = [mods.homelink_dashboard, mods.homelink_dashboard_validation]
    runs.alertsSmoke.loadedMods = [mods.homelink_dashboard, mods.homelink_dashboard_validation]
    runs.performanceSmoke.loadedMods = [mods.homelink_dashboard, mods.homelink_dashboard_validation]
    runs.persistence.loadedMods = [mods.homelink_dashboard, mods.homelink_dashboard_validation]
}

def persistenceProperties = layout.buildDirectory.file('validation/persistence/server.properties')
def persistenceLog = layout.buildDirectory.file('validation/persistence/logs/latest.log')
def persistencePass = providers.gradleProperty('persistencePass').getOrElse('read').toUpperCase(java.util.Locale.ROOT)
tasks.named('runPersistence') {
    doFirst {
        def properties = persistenceProperties.get().asFile
        if (!properties.exists()) { properties.parentFile.mkdirs(); properties.setText('', 'UTF-8') }
    }
    doLast {
        def report = persistenceLog.get().asFile
        if (!report.exists() || !report.getText('UTF-8').contains('HOMELINK_PERSISTENCE_' + persistencePass + '_OK')) {
            throw new GradleException('Persistence verification failed; inspect build/validation/persistence/logs/latest.log.')
        }
    }
}

def performanceOptions = layout.buildDirectory.file('validation/performance/options.txt')
def performanceLog = layout.buildDirectory.file('validation/performance/logs/latest.log')
tasks.named('runPerformanceSmoke') {
    doFirst {
        def options = performanceOptions.get().asFile
        if (!options.exists()) {
            options.parentFile.mkdirs()
            options.setText('onboardAccessibility:false\npauseOnLostFocus:false\nrenderDistance:2\nsimulationDistance:5\nmaxFps:60\n', 'UTF-8')
        }
    }
    doLast {
        def report = performanceLog.get().asFile
        def result = report.exists() ? report.getText('UTF-8') : ''
        if (!result.contains('HOMELINK_PERFORMANCE_SMOKE_OK') || result.contains('HOMELINK_PERFORMANCE_SMOKE_FAILED')) {
            throw new GradleException('Performance verification failed; inspect build/validation/performance/logs/latest.log.')
        }
    }
}

